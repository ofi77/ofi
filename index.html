
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Deutschland-Ticket Überprüfung</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f2f2; padding: 30px; }
        .ticket { background: white; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { color: #c00; }
        .info { margin-top: 15px; }
    </style>
</head>
<body>
    <div class="ticket">
        <h2>Deutschland-Ticket</h2>
        <div class="info">
            <p><strong>Name:</strong> Zeinab Alo</p>
            <p><strong>Geburtsdatum:</strong> 01.03.1996</p>
            <p><strong>Gültig von:</strong> 01.05.2025</p>
            <p><strong>Gültig bis:</strong> 31.05.2025</p>
            <p><strong>Status:</strong> Gültig</p>
        </div>
    </div>
</body>
</html>
